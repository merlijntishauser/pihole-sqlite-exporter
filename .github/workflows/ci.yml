name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff lint
        run: .venv/bin/ruff check .

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff format
        run: .venv/bin/ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pyright
        run: .venv/bin/pyright

  test:
    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: .venv/bin/pytest --cov=src --cov-report=term-missing

  contract:
    runs-on: ubuntu-latest
    needs:
      - lint
      - format
      - typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Start Pi-hole container
        run: |
          docker run -d --name pihole \
            --cap-add=NET_ADMIN \
            -e TZ=UTC \
            -e WEBPASSWORD=admin \
            -e FTLCONF_LOCAL_IPV4=127.0.0.1 \
            pihole/pihole:latest

      - name: Wait for Pi-hole databases
        run: |
          for i in $(seq 1 30); do
            if docker exec pihole test -f /etc/pihole/pihole-FTL.db && \
               docker exec pihole test -f /etc/pihole/gravity.db; then
              echo "Pi-hole DBs ready."
              exit 0
            fi
            sleep 2
          done
          docker logs pihole
          exit 1

      - name: Copy Pi-hole databases
        run: |
          docker cp pihole:/etc/pihole/pihole-FTL.db .ci-pihole-FTL.db
          docker cp pihole:/etc/pihole/gravity.db .ci-gravity.db

      - name: Contract tests
        env:
          PIHOLE_CONTRACT: "1"
          PIHOLE_FTL_DB: .ci-pihole-FTL.db
          PIHOLE_GRAVITY_DB: .ci-gravity.db
        run: .venv/bin/pytest tests/test_contract_pihole.py

      - name: Cleanup Pi-hole container
        if: always()
        run: |
          docker rm -f pihole
          rm -f .ci-pihole-FTL.db .ci-pihole-FTL.db-shm .ci-pihole-FTL.db-wal .ci-gravity.db
