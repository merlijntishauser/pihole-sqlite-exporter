name: Docker Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      scan_only:
        description: "Run Dockle/Trivy scans only (no push or README updates)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to DHI registry
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: merlijntishauser/pihole-sqlite-exporter
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=true

      - name: Build image for scans
        run: docker build -f docker/Dockerfile.alpine --build-arg GIT_COMMIT=${{ github.sha }} -t scan-image:${{ github.sha }} .

      - name: Dockle scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock goodwithtech/dockle:latest --format json scan-image:${{ github.sha }} > dockle.json

      - name: Fail on Dockle fatals
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("dockle.json")
          if not path.exists():
            print("dockle.json not found.")
            sys.exit(1)

          data = json.loads(path.read_text())
          fatal = 0
          fatal_details = []

          if isinstance(data, dict):
            summary = data.get("Summary") or data.get("summary") or {}
            if summary:
              value = summary.get("FATAL", summary.get("fatal", 0))
              try:
                fatal = int(value or 0)
              except (TypeError, ValueError):
                fatal = 0
            else:
              details = data.get("Details") or data.get("details") or []
              for item in details:
                level = item.get("Level") or item.get("level")
                if str(level).upper() == "FATAL":
                  fatal += 1
                  fatal_details.append(item)
          elif isinstance(data, list):
            for item in data:
              level = item.get("Level") or item.get("level")
              if str(level).upper() == "FATAL":
                fatal += 1
                fatal_details.append(item)

          if fatal:
            print(f"Dockle fatal findings: {fatal}")
            if not fatal_details and isinstance(data, dict):
              fatal_details = data.get("Details") or data.get("details") or []
            for item in fatal_details:
              level = str(item.get("Level") or item.get("level") or "").upper()
              if level and level != "FATAL":
                continue
              code = item.get("Code") or item.get("code") or "UNKNOWN"
              title = item.get("Title") or item.get("title") or ""
              desc = item.get("Description") or item.get("description") or ""
              print(f"- {code}: {title}".rstrip())
              if desc:
                print(f"  {desc}")
            sys.exit(1)
          print("Dockle fatal findings: 0")
          PY

      - name: Trivy scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --format json --output trivy.json scan-image:${{ github.sha }}

      - name: Sync main
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Update repository overview
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        run: python3 scripts/update_overview.py

      - name: Commit overview update
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f dockle.json trivy.json
          git add README.md dockerhub-description.md
          if git diff --cached --quiet; then
            echo "No overview changes to commit."
          else
            git commit -m "Update scan overview"
            git push origin HEAD:main
          fi

      - name: Build and push
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Docker Hub description
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.scan_only != 'true' }}
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: merlijntishauser/pihole-sqlite-exporter
          readme-filepath: dockerhub-description.md
